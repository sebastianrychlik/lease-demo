<div class="app-data-table">
  @if (loading()) {
    <div class="app-data-table__loading" role="status" aria-live="polite">Loading…</div>
  }

  <table
    mat-table
    [dataSource]="rows()"
    matSort
    [matSortActive]="activeSortField() ?? ''"
    [matSortDirection]="activeSortDirection() ?? 'asc'"
    matSortDisableClear
    (matSortChange)="onMatSortChange($event)"
    class="app-data-table__table"
  >
    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        @if (column.sortable) {
          <th mat-header-cell *matHeaderCellDef mat-sort-header [class]="column.cssClass">
            {{ column.label }}
          </th>
        } @else {
          <th mat-header-cell *matHeaderCellDef [class]="column.cssClass">
            {{ column.label }}
          </th>
        }
        <td mat-cell *matCellDef="let row" [class]="column.cssClass">
          {{ cellValue(column, row) }}
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="columnKeys"></tr>
    <tr mat-row *matRowDef="let row; columns: columnKeys"></tr>
  </table>
</div>
