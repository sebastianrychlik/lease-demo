<header class="app-header">
  <span class="app-header__brand">LeaseDemo</span>

  <div class="app-header__user">
    @if (authService.username()) {
      <span class="app-header__username">{{ authService.username() }}</span>
    }
    <button class="app-header__logout" type="button" (click)="authService.logout()">
      Logout
    </button>
  </div>
</header>
