<app-page-header

></app-page-header>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <app-card>
    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-text-secondary">{{ 'admin.dashboard.customers' | transloco }}</span>
      <span class="text-text-primary">{{ 'admin.dashboard.customersDescription' | transloco }}</span>
    </div>

  <app-card>
    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-text-secondary">{{ 'admin.dashboard.leases' | transloco }}</span>
      <span class="text-text-primary">{{ 'admin.dashboard.leasesDescription' | transloco }}</span>
    </div>
  </app-card>
  <app-card>
    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-text-secondary">{{ 'admin.dashboard.uxDemo' | transloco }}</span>
      <span class="text-text-primary">{{ 'admin.dashboard.uxDemoDescription' | transloco }}</span>
    </div>
