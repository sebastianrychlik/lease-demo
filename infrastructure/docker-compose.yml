name: lease-demo-infrastructure

services:
  # ==========================================================================
  # 1. KEYCLOAK
  # Authentication / Authorization / OIDC / JWT
  # ==========================================================================

  lease-demo-keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: lease-demo-keycloak

    command:
      - start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8081:8080"

    volumes:
      # Existing Keycloak H2 database.
      # Realm, users, clients and roles survive container recreation.
      - ./keycloak/data:/opt/keycloak/data

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 2. POSTGRESQL — POLAND
  # Main PL business database + Spock extension
  # ==========================================================================

  lease-demo-postgres-pl:
    image: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard
    container_name: lease-demo-postgres-pl
    hostname: lease-demo-postgres-pl

    environment:
      POSTGRES_DB: lease_demo
      POSTGRES_USER: leasedemo
      POSTGRES_PASSWORD: leasedemo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # pgEdge recommended data directory layout.
      PGDATA: /var/lib/pgsql/17/data

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_worker_processes=10
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=spock
      - -c
      - track_commit_timestamp=on
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,spock_output
      - -c
      - listen_addresses=*

    ports:
      - "5433:5432"

    volumes:
      - lease-demo-postgres-pl-data:/var/lib/pgsql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasedemo -d lease_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 3. POSTGRESQL — GERMANY
  # DE business database + Spock extension
  # ==========================================================================

  lease-demo-postgres-de:
    image: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard
    container_name: lease-demo-postgres-de
    hostname: lease-demo-postgres-de

    environment:
      POSTGRES_DB: lease_demo
      POSTGRES_USER: leasedemo
      POSTGRES_PASSWORD: leasedemo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/pgsql/17/data

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_worker_processes=10
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=spock
      - -c
      - track_commit_timestamp=on
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,spock_output
      - -c
      - listen_addresses=*

    ports:
      - "5434:5432"

    volumes:
      - lease-demo-postgres-de-data:/var/lib/pgsql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasedemo -d lease_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 4. REDIS
  #
  # Shared ephemeral state:
  #   - unfinished Lease Application drafts
  #
  # Distributed cache:
  #   - NBP / FX exchange rates
  # ==========================================================================

  lease-demo-redis-shared:
    image: redis:8.2.8-alpine
    container_name: lease-demo-redis-shared
    hostname: lease-demo-redis-shared

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "6379:6379"

    volumes:
      - lease-demo-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 5. APACHE KAFKA
  #
  # Single-node local KRaft cluster.
  # No ZooKeeper.
  #
  # Host applications:
  #   localhost:9092
  #
  # Docker containers:
  #   lease-demo-kafka-events:19092
  # ==========================================================================

  lease-demo-kafka-events:
    image: apache/kafka:4.3.1
    container_name: lease-demo-kafka-events
    hostname: lease-demo-kafka-events

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: "1"

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://lease-demo-kafka-events:19092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@lease-demo-kafka-events:29093

      # Fixed ID is fine for this persistent local single-node lab.
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # Single broker development settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      KAFKA_NUM_PARTITIONS: "3"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - lease-demo-kafka-data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 6. KAFKA CONNECT + DEBEZIUM
  #
  # CDC:
  # PostgreSQL WAL
  #      |
  #      v
  # Debezium PostgreSQL Connector
  #      |
  #      v
  # Kafka
  #
  # Connector itself will be registered later through port 8083.
  # ==========================================================================

  lease-demo-kafka-connect-cdc:
    image: quay.io/debezium/connect:3.6
    container_name: lease-demo-kafka-connect-cdc
    hostname: lease-demo-kafka-connect-cdc

    depends_on:
      lease-demo-kafka-events:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: lease-demo-kafka-events:19092

      GROUP_ID: "1"

      CONFIG_STORAGE_TOPIC: lease-demo-connect-configs
      OFFSET_STORAGE_TOPIC: lease-demo-connect-offsets
      STATUS_STORAGE_TOPIC: lease-demo-connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: lease-demo-kafka-connect-cdc

    ports:
      - "8083:8083"

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 7. ELASTICSEARCH
  #
  # Shared EU search/read model.
  #
  # PostgreSQL remains Source of Truth.
  # Elasticsearch stores derived search documents only.
  # ==========================================================================

  lease-demo-elasticsearch-eu-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: lease-demo-elasticsearch-eu-search
    hostname: lease-demo-elasticsearch-eu-search

    environment:
      discovery.type: single-node

      cluster.name: lease-demo-eu-search
      node.name: lease-demo-elasticsearch-eu-search

      # LOCAL DEVELOPMENT ONLY.
      xpack.security.enabled: "false"

      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9200:9200"

    volumes:
      - lease-demo-elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 8. MAILPIT
  #
  # Local SMTP + Web Inbox
  #
  # SMTP:
  #   localhost:1025
  #
  # Web UI:
  #   http://localhost:8025
  # ==========================================================================

  lease-demo-mailpit:
    image: axllent/mailpit:latest
    container_name: lease-demo-mailpit
    hostname: lease-demo-mailpit

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"

      # Convenient for LOCAL DEVELOPMENT only.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    ports:
      - "8025:8025"
      - "1025:1025"

    volumes:
      - lease-demo-mailpit-data:/data

    networks:
      - lease-demo-network

    restart: unless-stopped

  # ==========================================================================
  # 9. KAFKA UI
  #
  # http://localhost:8090
  #
  # Topics
  # Partitions
  # Messages
  # Consumer Groups
  # Consumer Lag
  # Kafka Connect
  # ==========================================================================

  lease-demo-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lease-demo-kafka-ui
    hostname: lease-demo-kafka-ui

    depends_on:
      lease-demo-kafka-events:
        condition: service_healthy

      lease-demo-kafka-connect-cdc:
        condition: service_started

    environment:
      KAFKA_CLUSTERS_0_NAME: LeaseDemo Local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        lease-demo-kafka-events:19092

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: >
        LeaseDemo Debezium CDC

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: >
        http://lease-demo-kafka-connect-cdc:8083

      DYNAMIC_CONFIG_ENABLED: "true"

    ports:
      - "8090:8080"

    networks:
      - lease-demo-network

    restart: unless-stopped

# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================

volumes:
  lease-demo-postgres-pl-data:
    name: lease-demo-postgres-pl-data

  lease-demo-postgres-de-data:
    name: lease-demo-postgres-de-data

  lease-demo-redis-data:
    name: lease-demo-redis-data

  lease-demo-kafka-data:
    name: lease-demo-kafka-data

  lease-demo-elasticsearch-data:
    name: lease-demo-elasticsearch-data

  lease-demo-mailpit-data:
    name: lease-demo-mailpit-data

# =============================================================================
# SHARED DOCKER NETWORK
# =============================================================================

networks:
  lease-demo-network:
    name: lease-demo-network
    driver: bridge
