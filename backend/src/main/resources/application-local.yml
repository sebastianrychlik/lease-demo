spring:
  application:
    name: lease-demo
  datasource:
    # Local PostgreSQL 17 running in Docker (container: lease-demo-postgres).
    # These are LOCAL DEVELOPMENT credentials for the disposable Docker
    # environment only — never used in production.
    url: jdbc:postgresql://localhost:5433/lease_demo
    username: leasedemo
    password: leasedemo
  jpa:
    hibernate:
      # Flyway owns schema evolution. Hibernate must never create/alter the
      # schema — it only validates that entity mappings match what Flyway
      # has already migrated.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak OIDC issuer URI for local development.
          # Spring Security fetches JWK set from this issuer's discovery endpoint
          # at startup and validates incoming access tokens locally.
          issuer-uri: http://localhost:8081/realms/lease-demo

server:
  port: 8080

application:
  cors:
    # Angular dev server origin — the only allowed cross-origin caller locally.
    allowed-origins: http://localhost:4200

logging:
  level:
    root: INFO
    com.leasedemo: DEBUG
