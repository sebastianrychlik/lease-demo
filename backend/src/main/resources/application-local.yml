spring:
  application:
    name: lease-demo
  datasource:
    # Local PostgreSQL 17 running in Docker (container: lease-demo-postgres).
    # These are LOCAL DEVELOPMENT credentials for the disposable Docker
    # environment only — never used in production.
    url: jdbc:postgresql://localhost:5433/lease_demo
    username: leasedemo
    password: leasedemo
  jpa:
    hibernate:
      # Flyway owns schema evolution. Hibernate must never create/alter the
      # schema — it only validates that entity mappings match what Flyway
      # has already migrated.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak OIDC issuer URI for local development.
          # Spring Security fetches JWK set from this issuer's discovery endpoint
          # at startup and validates incoming access tokens locally.
          issuer-uri: http://localhost:8081/realms/lease-demo

server:
  port: 8080

application:
  cors:
    # Angular dev server origin — the only allowed cross-origin caller locally.
    allowed-origins: http://localhost:4200
  crypto:
    # Application-level field encryption keys (PESEL). No fallback/default
    # value is committed here — every environment, including local
    # development, must supply its own Base64-encoded 256-bit keys via the
    # CRYPTO_AES_KEY / CRYPTO_HMAC_KEY environment variables. The application
    # fails fast at startup (see AesGcmEncryptionService/HmacLookupHashService)
    # if these are missing, malformed, or too short.
    #
    # Generate local development keys with, e.g.:
    #   openssl rand -base64 32
    # and export them in your shell before starting the backend:
    #   export CRYPTO_AES_KEY=...
    #   export CRYPTO_HMAC_KEY=...
    # Never commit real key material to source control.
    aes-key: ${CRYPTO_AES_KEY}
    hmac-key: ${CRYPTO_HMAC_KEY}

logging:
  level:
    root: INFO
    com.leasedemo: DEBUG
