spring:
  application:
    name: lease-demo
  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

application:
  version: 0.1.0

leasedemo:
  lease:
    # Current business market resolution (M5.1.2). NOT supplied by
    # Angular — the backend is the sole authority. Will later resolve
    # from the authenticated Customer's market instead of this static
    # property, without changing the Lease Product API contract.
    default-market: PL
