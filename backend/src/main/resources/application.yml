spring:
  application:
    name: lease-demo
  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

application:
  version: 0.1.0
