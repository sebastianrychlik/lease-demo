spring:
  application:
    name: lease-demo
  datasource:
    # Production datasource — fully environment-driven. No hardcoded
    # credentials. The same JDBC-based configuration works against any
    # managed PostgreSQL instance without code changes.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns schema evolution in every environment, including
      # production. Hibernate never creates/alters the schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Production Keycloak issuer URI supplied via environment variable.
          # Must point to the production Keycloak realm — NOT localhost.
          # Example: https://auth.example.com/realms/lease-demo
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: 8080

application:
  cors:
    # Production allowed origins supplied via environment variable.
    # Comma-separated list of origins (no trailing slash).
    # Example: https://app.example.com,https://www.app.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  crypto:
    # Application-level field encryption keys (PESEL) — Base64-encoded
    # 256-bit keys, injected via environment variables/secret store.
    # Never committed to source control. Rotating these keys requires
    # re-encrypting/re-hashing existing pesel_encrypted/pesel_lookup data.
    aes-key: ${CRYPTO_AES_KEY}
    hmac-key: ${CRYPTO_HMAC_KEY}

logging:
  level:
    root: WARN
    com.leasedemo: INFO
