spring:
  application:
    name: lease-demo
  security:
    oauth2:
      resourceserver:
        jwt:
          # Production Keycloak issuer URI supplied via environment variable.
          # Must point to the production Keycloak realm — NOT localhost.
          # Example: https://auth.example.com/realms/lease-demo
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: 8080

application:
  cors:
    # Production allowed origins supplied via environment variable.
    # Comma-separated list of origins (no trailing slash).
    # Example: https://app.example.com,https://www.app.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.leasedemo: INFO
